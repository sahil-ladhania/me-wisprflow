<!-- @dsCard group="Journal" height=440 subtitle="A real photo printed with a border and taped to the page" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TapedPhoto — preview</title></head>
<body>
<div class="rd-frame" style="display:flex;gap:56px;flex-wrap:wrap;padding:36px 40px">
  <figure class="rd-photo" style="--tilt:-2.5deg;width:240px">
    <span class="rd-tape rd-tape--tl"></span><span class="rd-tape rd-tape--tr"></span>
    <div class="rd-photo__print"><div class="rd-photo__slot">Photo · 4:5</div></div>
    <figcaption class="rd-photo__caption">only boy in the kitchen. won anyway.</figcaption>
  </figure>
  <figure class="rd-photo" style="--tilt:1.8deg;--ratio:4/3;width:300px">
    <span class="rd-tape rd-tape--top"></span>
    <div class="rd-photo__print"><div class="rd-photo__slot">Photo · 4:3</div></div>
    <figcaption class="rd-photo__caption">still ride it. still black.</figcaption>
  </figure>
</div>
<script>window.TheRide && window.TheRide.mount(document);</script>
</body>
</html>
