<!-- @dsCard group="Voice" height=190 subtitle="A short real voice note with waveform and transcript" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VoiceNote — preview</title></head>
<body>
<div class="rd-frame">
<figure class="rd-voice " data-rd="VoiceNote" data-duration="18" data-seed="5" data-bars="44">
  <div class="rd-voice__capsule">
    <button class="rd-voice__play" type="button" aria-label="Play voice note, 18 seconds"><svg class="rd-i-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5.8v12.4L18.5 12z"/></svg><svg class="rd-i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5.5" width="3.6" height="13" rx="1"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1"/></svg></button>
    <div class="rd-wave" aria-hidden="true"></div>
    <span class="rd-voice__time rd-meta">0:00</span>
  </div>
  <div class="rd-voice__foot">
    <span class="rd-voice__where">recorded on the bike, 2026</span>
    <details class="rd-voice__transcript"><summary>Read it instead</summary></details>
  </div>
  <p class="rd-voice__text" hidden>Dad said 90. I came home with 80 and a speech ready. He didn’t let me finish. He just handed me the keys.</p>
</figure>
</div>
<script>window.TheRide && window.TheRide.mount(document);</script>
</body>
</html>
