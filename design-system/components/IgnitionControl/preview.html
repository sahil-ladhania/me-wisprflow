<!-- @dsCard group="Voice" height=200 subtitle="Say “let’s ride” or tap: the hero’s engine start" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IgnitionControl — preview</title></head>
<body>
<div class="rd-frame">
  <div class="rd-ignition" data-rd="IgnitionControl" data-state="off">
    <button class="rd-ignition__key" type="button" aria-pressed="false">
      <span class="rd-ignition__mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></span>
      <span class="rd-ignition__text">
        <span class="rd-ignition__say">Say <q>let’s ride</q></span>
        <span class="rd-ignition__hint">or tap to start</span>
        <span class="rd-ignition__heard">“let’s ride” ✓</span>
      </span>
      <span class="rd-wave rd-wave--live" aria-hidden="true"></span>
    </button>
    <p class="rd-ignition__status" aria-live="polite">Engine off.</p>
  </div>
  <p class="rd-meta" style="margin:24px 0 0">Click the key to run the demo: off → listening → heard → engine on.</p>
</div>
<script>window.TheRide && window.TheRide.mount(document);</script>
</body>
</html>
